# Communication Service
spring.application.name=communication-service
server.port=8084

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/wheelconnect_communication?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:WheelConnectSuperSecretKeyJWTTokenSigningForSecurity2026!!!}
jwt.issuer=WheelConnectIssuer
jwt.audience=WheelConnectAudience
jwt.expiration-hours=10

# Service Endpoints
services.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8082}

# Logging
logging.level.root=INFO
logging.level.com.wheelconnect=DEBUG
