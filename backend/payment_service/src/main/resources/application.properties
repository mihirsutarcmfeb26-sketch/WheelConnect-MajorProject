# Payment Service Configuration
spring.application.name=payment-service
server.port=8085

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/wheelconnect_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:cdac}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:WheelConnectSuperSecretKeyJWTTokenSigningForSecurity2026!!!}
jwt.issuer=WheelConnectIssuer
jwt.audience=WheelConnectAudience
jwt.expiration-hours=10

# Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TLnOdWwyCvtECM}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:eaRSrel0IOBemnZ6CbmKoUTf}

# Services Endpoints
services.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8082}
services.service-center-service.url=${SERVICE_CENTER_SERVICE_URL:http://localhost:8083}

# Logging
logging.level.root=INFO
logging.level.com.wheelconnect=DEBUG
